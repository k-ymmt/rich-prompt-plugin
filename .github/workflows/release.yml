name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install cargo-component
        run: cargo install cargo-component --locked --version 0.18.0
      - name: Install wkg
        run: cargo install wkg --locked
      - name: Configure wkg registry
        run: wkg config --default-registry wa.dev
      - run: cargo component build --target wasm32-wasip2 --release
      - name: Rename artifact
        run: cp target/wasm32-wasip2/release/rich_prompt_plugin.wasm rich-prompt-plugin.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: rich-prompt-plugin
          path: rich-prompt-plugin.wasm

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes rich-prompt-plugin.wasm
