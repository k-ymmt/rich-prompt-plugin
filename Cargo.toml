[package]
name = "rich-prompt-plugin"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
yosh-plugin-sdk = { git = "https://github.com/k-ymmt/yosh", tag = "v0.2.1" }

[package.metadata.component]
package = "k-ymmt:rich-prompt-plugin"

[package.metadata.component.target.dependencies."yosh:plugin"]
version = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
